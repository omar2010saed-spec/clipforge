name: Build APK

# Builds an installable Android APK on GitHub's servers. No accounts or secrets needed.
#  - every push to main / pull request: runs checks and uploads the APK as an artifact
#  - pushing a tag like v1.0.0: also publishes the APK on the GitHub Releases page
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      # Informational: a type warning will not stop you from getting an APK.
      - name: Type check
        run: npm run typecheck
        continue-on-error: true

      - name: Unit tests
        run: npm test -- --ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: |
          NAME="${GITHUB_REF_NAME//\//-}"
          cp android/app/build/outputs/apk/release/app-release.apk "ClipForge-$NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ClipForge-apk
          path: ClipForge-*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ClipForge-*.apk
