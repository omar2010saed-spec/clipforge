name: Build APK

# Builds an installable Android APK on GitHub's servers. No accounts or secrets needed.
#  - every push to main / pull request: runs checks and uploads the APK as an artifact
#  - pushing a tag like v1.0.0: also publishes the APK on the GitHub Releases page
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          set -o pipefail
          npm install 2>&1 | tee -a ci.log

      # Informational: a type warning will not stop you from getting an APK.
      - name: Type check
        continue-on-error: true
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log

      - name: Unit tests
        run: |
          set -o pipefail
          npm test -- --ci 2>&1 | tee -a ci.log

      - name: Generate native Android project
        run: |
          set -o pipefail
          npx expo prebuild --platform android --no-install 2>&1 | tee -a ci.log

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee -a ../ci.log

      - name: Name the APK
        run: |
          NAME="${GITHUB_REF_NAME//\//-}"
          cp android/app/build/outputs/apk/release/app-release.apk "ClipForge-$NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ClipForge-apk
          path: ClipForge-*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ClipForge-*.apk

      # On failure, copy the tail of the log into an annotation so it is visible on the run page.
      - name: Show failure details
        if: failure()
        run: |
          for f in ci.log typecheck.log; do
            [ -f "$f" ] || continue
            tail -n 45 "$f" | python3 -c "import sys; t=sys.stdin.read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'); print('::error title=Log tail ($f)::'+t)"
          done
