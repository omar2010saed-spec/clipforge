name: Build APK

# Builds an installable Android APK on GitHub's servers. No accounts or secrets needed.
#  - every push to main / pull request: runs checks and uploads the APK as an artifact
#  - pushing a tag like v1.0.0: also publishes the APK on the GitHub Releases page
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # 1) is the FFmpeg engine already built? (it is built once and kept as a release asset)
  engine-check:
    runs-on: ubuntu-24.04
    outputs:
      exists: ${{ steps.c.outputs.exists }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view ffmpeg-engine --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx ffmpeg-kit.aar; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  # 2) if not, build it first (one time, ~1 hour)
  engine:
    needs: engine-check
    if: needs.engine-check.outputs.exists != 'true'
    uses: ./.github/workflows/build-ffmpeg.yml

  apk:
    needs: [engine-check, engine]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          set -o pipefail
          npm install 2>&1 | tee -a ci.log

      # Informational: a type warning will not stop you from getting an APK.
      - name: Fetch FFmpeg engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ffmpeg-engine --repo "$GITHUB_REPOSITORY" -p ffmpeg-kit.aar -D engine --clobber
          node scripts/make-local-maven.js engine/ffmpeg-kit.aar

      - name: Fetch FFmpeg engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ffmpeg-engine --repo "$GITHUB_REPOSITORY" -p ffmpeg-kit.aar -D engine --clobber
          node scripts/make-local-maven.js engine/ffmpeg-kit.aar

      - name: Type check
        continue-on-error: true
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log

      - name: Unit tests
        run: |
          set -o pipefail
          npm test -- --ci 2>&1 | tee -a ci.log

      - name: Generate native Android project
        run: |
          set -o pipefail
          npx expo prebuild --platform android --no-install 2>&1 | tee -a ci.log

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee -a ../ci.log

      - name: Name the APK
        run: |
          NAME="${GITHUB_REF_NAME//\//-}"
          cp android/app/build/outputs/apk/release/app-release.apk "ClipForge-$NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ClipForge-apk
          path: ClipForge-*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ClipForge-*.apk

      # On failure, copy the tail of the log into an annotation so it is visible on the run page.
      - name: Show failure details
        if: failure()
        run: |
          for f in ci.log typecheck.log; do
            [ -f "$f" ] || continue
            tail -n 45 "$f" | python3 -c "import sys; t=sys.stdin.read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'); print('::error title=Log tail ($f)::'+t)"
          done
