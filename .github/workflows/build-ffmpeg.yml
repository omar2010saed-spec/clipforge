name: Build FFmpeg engine

# Builds the FFmpegKit Android library (AAR) from source and publishes it as the
# "ffmpeg-engine" release asset. The APK workflow downloads it from there.
# Runs only once (or when you start it manually); takes roughly 40-70 minutes.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ffmpeg:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config nasm yasm gettext gperf cmake git curl texinfo meson ninja-build rsync python3 patch xz-utils bzip2 unzip

      - name: Install NDK r25
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.2.9519653" "platforms;android-33" "build-tools;33.0.2"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Get FFmpegKit source
        run: git clone --depth 1 --branch v6.0 https://github.com/arthenica/ffmpeg-kit.git "$RUNNER_TEMP/ffmpeg-kit"

      - name: Build FFmpegKit (LGPL, hardware codecs via MediaCodec)
        working-directory: ${{ runner.temp }}/ffmpeg-kit
        run: |
          set -o pipefail
          ./android.sh --api-level=24 --disable-x86 --disable-x86-64 --disable-arm-v7a \
            --enable-android-media-codec --enable-android-zlib --enable-gnutls 2>&1 | tee "$GITHUB_WORKSPACE/ffmpeg-build.log"

      - name: Locate AAR
        run: |
          AAR=$(find "$RUNNER_TEMP/ffmpeg-kit/prebuilt" -name '*.aar' | head -1)
          echo "AAR=$AAR"
          test -f "$AAR"
          cp "$AAR" ffmpeg-kit.aar
          ls -la ffmpeg-kit.aar

      - name: Publish as release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ffmpeg-engine >/dev/null 2>&1 || gh release create ffmpeg-engine --title "FFmpeg engine (internal)" --notes "Prebuilt FFmpegKit AAR used by the APK workflow." --prerelease
          gh release upload ffmpeg-engine ffmpeg-kit.aar --clobber

      - name: Show failure details
        if: failure()
        run: |
          echo "::error title=ffmpeg build log tail::$(tail -n 40 ffmpeg-build.log 2>/dev/null | head -c 3500 | sed -z 's/\n/%0A/g')"
          F=$(find "$RUNNER_TEMP/ffmpeg-kit" -name 'build.log' 2>/dev/null | head -1)
          [ -n "$F" ] && echo "::error title=ffmpeg-kit build.log::$(tail -n 40 "$F" | head -c 3500 | sed -z 's/\n/%0A/g')" || true
