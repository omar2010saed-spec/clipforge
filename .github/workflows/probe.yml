name: Probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe
        shell: bash {0}
        run: |
          for n in ffmpeg-kit-full-gpl ffmpeg-kit-video; do
            echo "## $n" >> out.txt
            curl -s https://repo1.maven.org/maven2/com/arthenica/$n/maven-metadata.xml | tr -d ' \n' >> out.txt; echo >> out.txt
            for v in 6.0.LTS 6.0-2 6.0-2.LTS 6.0.1; do
              echo "$n $v $(curl -s -o /dev/null -w '%{http_code}' -I https://repo1.maven.org/maven2/com/arthenica/$n/$v/$n-$v.aar)" >> out.txt
            done
          done
          mkdir t; cd t; npm pack ffmpeg-kit-react-native@6.0.2 -s >/dev/null 2>&1; tar xzf *.tgz
          echo "## gradle" >> ../out.txt
          grep -nE "ffmpeg|implementation" package/android/build.gradle | head -15 >> ../out.txt
          ls package >> ../out.txt
          cd ..
          echo "::error title=probe::$(head -c 3500 out.txt | sed -z 's/\n/%0A/g')"
