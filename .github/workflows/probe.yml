name: Probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe
        run: |
          {
          for n in ffmpeg-kit-full-gpl ffmpeg-kit-video ffmpeg-kit-min-gpl; do
            echo "## $n versions"
            curl -s https://repo1.maven.org/maven2/com/arthenica/$n/maven-metadata.xml | grep -E '<version>|latest|release' | tr -d ' \n'; echo
            for v in 6.0.LTS 6.0-2 6.0-2.LTS 6.0; do
              echo "$n $v aar=$(curl -s -o /dev/null -w '%{http_code} %{size_download}' -I https://repo1.maven.org/maven2/com/arthenica/$n/$v/$n-$v.aar)"
            done
          done
          echo "## npm 6.0.2 gradle"
          mkdir t && cd t && npm pack ffmpeg-kit-react-native@6.0.2 -s >/dev/null && tar xzf *.tgz && grep -nE "ffmpeg-kit|implementation|ffmpegKit" package/android/build.gradle | head -20
          grep -n "ffmpeg" package/ffmpeg-kit-react-native.podspec | head -5
          ls package; cat package/app.plugin.js 2>/dev/null | head -5
          } > out.txt 2>&1
          echo "::error title=probe::$(sed -z 's/\n/%0A/g' out.txt)"
