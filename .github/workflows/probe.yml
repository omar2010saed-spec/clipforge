name: Probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
          echo "## maven search"
          curl -s "https://search.maven.org/solrsearch/select?q=ffmpeg-kit&rows=40&wt=json" | python3 -c "import sys,json; d=json.load(sys.stdin); [print(x['id'],x['latestVersion']) for x in d['response']['docs']]" 2>&1
          echo "## direct maven checks"
          for a in ffmpeg-kit-full-gpl/6.0-2 ffmpeg-kit-full/6.0-2 ffmpeg-kit-min-gpl/6.0-2 ffmpeg-kit-https/6.0-2 ffmpeg-kit-video/6.0-2; do
            n=${a%%/*}; v=${a##*/}
            echo "$n $v $(curl -s -o /dev/null -w '%{http_code}' https://repo1.maven.org/maven2/com/arthenica/$n/$v/$n-$v.aar)"
          done
          echo "## releases"
          gh api repos/arthenica/ffmpeg-kit/releases --jq '.[]|.tag_name+" "+([.assets[].name]|join(","))' 2>&1 | cut -c1-400 | head -12
          echo "## ffmpeg-kit-next"
          gh api repos/arthenica/ffmpeg-kit-next/releases --jq '.[]|.tag_name+" "+([.assets[].name]|join(","))' 2>&1 | cut -c1-400 | head -8
          echo "## npm pkg"
          npm view ffmpeg-kit-react-native versions --json 2>&1 | tail -5
          npm view @spreen/ffmpeg-kit-react-native version 2>&1 | tail -2
          } > out.txt 2>&1
          while IFS= read -r l; do echo "::error title=probe::$l"; done < out.txt
